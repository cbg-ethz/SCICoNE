# An environment to use SCICoNE in, equivalent to
#   conda create -n scicone -c conda-forge -c bioconda scicone
# The scicone package brings both the command line executables and this Python
# package; see ../conda-recipe/README.md for building it from the working tree.
name: scicone
channels:
  - conda-forge
  - bioconda
dependencies:
  - python >=3.8
  - scicone
  - ipykernel
